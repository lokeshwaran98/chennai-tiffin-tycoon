name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.0" "platforms;android-35" "platforms;android-36" || true
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Install Godot and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.zip -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -30

      - name: Install Android gradle template
        run: |
          set -e
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build | head -20

      - name: Install AdMob plugin and Android libraries
        run: |
          set -e
          mkdir -p admob_dl && cd admob_dl
          gh release download --repo poingstudios/godot-admob-plugin --pattern 'poing-godot-admob-v*.zip' --pattern "android-template-v${GODOT_VERSION}.zip"
          unzip -q poing-godot-admob-v*.zip -d plugin
          mkdir -p ../addons
          cp -r plugin/poing-godot-admob/addons/admob ../addons/
          mkdir -p ../addons/admob/android/bin
          unzip -q "android-template-v${GODOT_VERSION}.zip" -d ../addons/admob/android/bin
          ls ../addons/admob ../addons/admob/android/bin | head -30

      - name: Debug keystore, release keystore and editor settings
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.7.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=real" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret: AAB will be signed with the debug key (pipeline test only)."
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=debugkey" >> "$GITHUB_ENV"
          fi

      - name: Set version code from run number
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          grep -n "version/" export_presets.cfg

      - name: Smoke test (run game headless, fail on script errors)
        run: |
          godot --headless --import 2>&1 | tail -20 || true
          timeout 180 godot --headless --fixed-fps 60 --quit-after 1500 -- --smoke 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Identifier not found" smoke.log; then
            echo "Smoke test found script errors"; exit 1
          fi
          grep -q "SMOKE_DONE" smoke.log || { echo "Smoke actions did not finish"; exit 1; }
          echo "Smoke test clean"

      - name: Render screenshot (software GL)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers >/dev/null
          export SHOT_PATH="$PWD/shot.png"
          xvfb-run -a -s "-screen 0 1280x1400x24" timeout 120 godot --rendering-driver opengl3 --resolution 540x960 -- --shot 2>&1 | tail -15 || true
          ls -la shot.png
          mkdir -p /tmp/shotrepo && cp shot.png /tmp/shotrepo/
          cd /tmp/shotrepo
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@example.com add shot.png
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshot"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" screenshots

      - name: Export debug APK (gradle)
        run: |
          set -e
          mkdir -p build
          godot --headless --export-debug "Android APK" build/chennai-tiffin-tycoon.apk 2>&1 | tail -60
          ls -la build/

      - name: Export release AAB (gradle)
        id: aab
        continue-on-error: true
        run: |
          set -e
          godot --headless --export-release "Android AAB" build/chennai-tiffin-tycoon.aab 2>&1 | tail -60
          ls -la build/

      - name: Verify outputs
        run: |
          set -e
          SIZE=$(stat -c %s build/chennai-tiffin-tycoon.apk)
          echo "APK size bytes: $SIZE"
          [ "$SIZE" -gt 1000000 ]
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs build/chennai-tiffin-tycoon.apk | head -2
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging build/chennai-tiffin-tycoon.apk | grep -E "^package|sdkVersion|targetSdkVersion|native-code|uses-permission" | head -12
          if [ -f build/chennai-tiffin-tycoon.aab ]; then
            echo "AAB size bytes: $(stat -c %s build/chennai-tiffin-tycoon.aab)"
            keytool -printcert -jarfile build/chennai-tiffin-tycoon.aab | head -4
            echo "RELEASE_SIGNED=$RELEASE_SIGNED"
          else
            echo "AAB was not produced"
          fi

      - name: Publish GitHub Release
        run: |
          TAG="v0.2.${{ github.run_number }}"
          FILES=(build/chennai-tiffin-tycoon.apk)
          [ -f build/chennai-tiffin-tycoon.aab ] && FILES+=(build/chennai-tiffin-tycoon.aab)
          gh release create "$TAG" "${FILES[@]}" \
            --title "Chennai Tiffin Tycoon $TAG" \
            --notes "APK: debug-signed test build (sideload). AAB: Play Store bundle (signing: ${RELEASE_SIGNED:-n/a})."
