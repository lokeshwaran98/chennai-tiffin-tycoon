name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" || true
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Install Godot and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.zip -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create debug keystore and editor settings
        run: |
          set -e
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Smoke test (run game headless, fail on script errors)
        run: |
          godot --headless --import || true
          timeout 180 godot --headless --fixed-fps 60 --quit-after 1500 -- --smoke 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Identifier not found" smoke.log; then
            echo "Smoke test found script errors"; exit 1
          fi
          grep -q "SMOKE_DONE" smoke.log || { echo "Smoke actions did not finish"; exit 1; }
          echo "Smoke test clean"

      - name: Render screenshot (software GL)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers >/dev/null
          export SHOT_PATH="$PWD/shot.png"
          xvfb-run -a -s "-screen 0 1280x1400x24" timeout 120 godot --rendering-driver opengl3 --resolution 540x960 -- --shot 2>&1 | tail -15 || true
          ls -la shot.png
          mkdir -p /tmp/shotrepo && cp shot.png /tmp/shotrepo/
          cd /tmp/shotrepo
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@example.com add shot.png
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshot"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" screenshots

      - name: Import project and export APK
        run: |
          set -e
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/chennai-tiffin-tycoon.apk

      - name: Verify APK
        run: |
          set -e
          ls -la build/
          SIZE=$(stat -c %s build/chennai-tiffin-tycoon.apk)
          echo "APK size bytes: $SIZE"
          [ "$SIZE" -gt 1000000 ]
          unzip -l build/chennai-tiffin-tycoon.apk | grep -E "AndroidManifest.xml|classes.dex|lib/arm64-v8a/.*\.so|assets/.*\.pck" || true
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/chennai-tiffin-tycoon.apk | head -3
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging build/chennai-tiffin-tycoon.apk | grep -E "^package|sdkVersion|native-code" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: chennai-tiffin-tycoon-apk
          path: build/chennai-tiffin-tycoon.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" build/chennai-tiffin-tycoon.apk \
            --title "Chennai Tiffin Tycoon $TAG (debug build)" \
            --notes "Debug-signed test build. Enable 'install unknown apps' to sideload."
