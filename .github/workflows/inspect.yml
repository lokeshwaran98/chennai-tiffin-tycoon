name: Inspect AdMob plugin

on:
  push:
    paths:
      - ".github/workflows/inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get plugin
        run: |
          mkdir -p p && cd p
          gh release download --repo poingstudios/godot-admob-plugin --pattern 'poing-godot-admob-v*.zip'
          unzip -q -o poing-godot-admob-v*.zip -d x
          cd x/poing-godot-admob
          echo "=== TREE ==="; find . -not -path '*xcframework*' -not -path './addons/admob/ios*' | grep -v "/ios" | head -120
      - name: Export plugin and library scripts
        run: |
          cd p/x/poing-godot-admob/addons/admob/internal/exporters/android
          for f in export_plugin.gd library.gd; do echo "=== $f ==="; cat $f; done
      - name: Setting keys and plugin entry
        run: |
          cd p/x/poing-godot-admob/addons/admob
          echo "=== admob.gd ==="; sed -n '1,120p' admob.gd
          echo "=== setting key grep ==="
          grep -rIn "ProjectSettings\|admob/" --include=*.gd . | grep -v "^./internal/exporters/ios" | head -60
